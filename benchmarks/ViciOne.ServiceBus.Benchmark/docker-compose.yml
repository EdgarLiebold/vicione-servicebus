# ViciOne modification: WP-F2-SERVICEBUS-CI-BASELINE-03, 2026-08-08.
# The rabbit service referenced vicione-servicebus/rabbitmq:latest, which does not exist.
# It now extends the single pinned fixture definition.
# ViciOne modification: WP-F2-SERVICEBUS-IDENTITY, 2026-08-07.
version: '2.3'
services:
  rabbitmq:
    extends:
      file: ../../build/test-infrastructure/compose.yaml
      service: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  mssql:
    image: "mcr.microsoft.com/mssql/server:2017-latest"
    environment:
      - "ACCEPT_EULA=Y"
      - "SA_PASSWORD=Password12!"
    ports:
      - "1433:1433"

  otel-collector:
    image: otel/opentelemetry-collector
    restart: always
    command: [ "--config=/etc/otelcol-config.yml" ]
    volumes:
      - ./configs/otel-collector/otelcol-config.yml:/etc/otelcol-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver

