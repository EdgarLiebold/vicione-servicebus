name: Bug Report
description: Create a bug report for an issue found in ViciOne.ServiceBus. Should not be used for questions on the use of ViciOne.ServiceBus.
body:
  - type: markdown
    attributes:
      value: |
        This form is for an issue found in ViciOne.ServiceBus that can be reproduced on the current
        development branch. This product is built and supported on Linux only.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How the maintainers can reach you about this report.
      placeholder: email@example.com
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: Commit
      description: >-
        ViciOne.ServiceBus has not been released yet, so a report names the commit it was observed on
        rather than a version.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: dropdown
    id: broker
    attributes:
      label: Using which broker(s) did you encounter the issue?
      multiple: true
      options:
        - RabbitMQ
        - ActiveMQ
        - SQL (PostgreSQL or SQL Server)
        - Azure Service Bus
        - Amazon SQS
        - Azure Event Hubs
        - In-Memory
        - Mediator
  - type: textarea
    id: steps
    attributes:
      label: What are the steps required to reproduce the issue?
      description: Outline the steps to reproduce the issue, including any relevant source code snippets.
      value: |
        1.
        2.
        3.
        ...
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      placeholder: It should work...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: Well, it's complicated...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Related log output, including any exceptions
      description: >-
        Paste any log output related to the issue; it is formatted as code automatically. Logs are
        usually required. ViciOne.ServiceBus logs through Microsoft.Extensions.Logging, so enabling
        Debug for the ViciOne.ServiceBus category in your host is what captures them.
      render: shell
  - type: input
    id: repositorty
    attributes:
      label: Link to repository that demonstrates/reproduces the issue
      description: If you have a standalone repository that reproduces the issue, paste the link here (highly recommended).
      placeholder: https://github.com/user/repo
    validations:
      required: false
