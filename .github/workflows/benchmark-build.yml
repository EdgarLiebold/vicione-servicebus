name: Benchmark build

on:
  push:
    paths:
      - 'benchmarks/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'ViciOne.ServiceBus.Benchmarks.slnx'
      - '.github/workflows/benchmark-build.yml'
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'ViciOne.ServiceBus.Benchmarks.slnx'
      - '.github/workflows/benchmark-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Compile benchmark tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore benchmark tools
        run: dotnet restore ViciOne.ServiceBus.Benchmarks.slnx -p:TargetFramework=net10.0
      - name: Compile benchmark tools
        run: dotnet build ViciOne.ServiceBus.Benchmarks.slnx --configuration Release --no-restore -p:TargetFramework=net10.0
      - name: Verify benchmark runner behavior
        run: dotnet test benchmarks/ViciOne.ServiceBus.Benchmarks.Tests/ViciOne.ServiceBus.Benchmarks.Tests.csproj --configuration Release --no-build --no-restore
