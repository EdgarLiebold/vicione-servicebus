#
# The required ViciOne CI profile. Every job here must really run and must prove a positive test
# count; a category that executes nothing is rejected by tools/ci/run_test_category.py rather than
# passing silently. Upstream repository and branch guards are gone: they were structurally false in
# this fork and made the whole publish chain disappear while the run still looked green.
#
# Transports that the fork preserves but ViciOne does not ship live in extended-transports.yml.
# They stay visible and manually runnable instead of being hidden behind an unsatisfiable condition.
name: Required CI

# No path filter. The rule below it rejects a job level condition because an unsatisfiable one makes
# a required category vanish while the run still reports success; a path allowlist on the trigger does
# the same thing to every job at once, and for every change outside the list. The delivered list left
# .editorconfig, signing.props, .gitattributes, .devcontainer/** and everything under tools/ outside
# tools/ci/** without any required gate. A required profile runs on every push and pull request.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  policy:
    name: "Required: Policy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate CI policy
        run: python3 tools/ci/policy_validator.py
      - name: Policy self-tests
        run: python3 tools/ci/test_policy_validator.py

  build:
    name: "Required: Build"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore

  analyzer:
    name: "Required: Analyzer"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Analyzer tests
        run: |
          python3 tools/ci/run_test_category.py \
            --category analyzer \
            --project tests/ViciOne.ServiceBus.Analyzers.Tests/ViciOne.ServiceBus.Analyzers.Tests.csproj \
            --evidence-dir artifacts/required/analyzer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-analyzer
          path: artifacts/required/analyzer

  core-unit:
    name: "Required: Core/Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Core tests
        run: |
          python3 tools/ci/run_test_category.py \
            --category core \
            --project tests/ViciOne.ServiceBus.Tests/ViciOne.ServiceBus.Tests.csproj \
            --evidence-dir artifacts/required/core -- -f net9.0
      - name: Abstractions tests
        run: |
          python3 tools/ci/run_test_category.py \
            --category abstractions \
            --project tests/ViciOne.ServiceBus.Abstractions.Tests/ViciOne.ServiceBus.Abstractions.Tests.csproj \
            --evidence-dir artifacts/required/core -- -f net9.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-core-unit
          path: artifacts/required/core

  rabbitmq:
    name: "Required: RabbitMQ"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # One run path for local and CI: the runner starts the pinned fixture, reads the ephemeral
      # loopback ports back from Docker, generates the run-scoped account, hands both to the test
      # process alone and tears the fixture down in a finally block.
      - name: RabbitMQ tests
        run: |
          python3 tools/ci/run_broker_category.py \
            --broker rabbitmq \
            --category rabbitmq \
            --project tests/ViciOne.ServiceBus.RabbitMqTransport.Tests/ViciOne.ServiceBus.RabbitMqTransport.Tests.csproj \
            --evidence-dir artifacts/required/rabbitmq \
            --ports-out artifacts/required/rabbitmq/endpoints.json \
            --one-refusal-per-vhost 'test-exclusive-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-rabbitmq
          path: artifacts/required/rabbitmq

  entity-framework:
    name: "Required: EntityFrameworkCore"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No service containers here. The databases come from the same pinned compose definition a developer
    # uses locally, started through the canonical runner, with a secret generated for this run. The
    # service containers that stood here used moving image tags and the well known password Password12!,
    # so a local run and the runner were not the same fixture and the account was not run-scoped.
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: EntityFrameworkCore tests
        run: |
          python3 tools/ci/run_broker_category.py \
            --broker mssql \
            --broker postgres \
            --category entity-framework-core \
            --project tests/ViciOne.ServiceBus.EntityFrameworkCoreIntegration.Tests/ViciOne.ServiceBus.EntityFrameworkCoreIntegration.Tests.csproj \
            --evidence-dir artifacts/required/entity-framework \
            --ports-out artifacts/required/entity-framework/endpoints.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-entity-framework
          path: artifacts/required/entity-framework
  pack:
    name: "Required: Pack"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pack runs only after every required gate is green. It builds verifiable run artifacts and
    # publishes nothing: no nuget.org push, no registry, no external side effect of any kind.
    needs:
      - policy
      - build
      - analyzer
      - core-unit
      - rabbitmq
      - entity-framework
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages
      - name: Hash packages
        run: |
          set -euo pipefail
          test -n "$(ls -A artifacts/packages)" || { echo "pack produced no package"; exit 1; }
          sha256sum artifacts/packages/*.nupkg | tee artifacts/packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: required-packages
          path: artifacts/packages
          if-no-files-found: error
