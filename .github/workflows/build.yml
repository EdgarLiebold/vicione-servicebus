#
# The required ViciOne CI profile. Every required job is one call to the canonical verification entry
# point, and nothing else: what a selection contains, which categories it runs, which brokers they
# need, how long they may take and which cases they are expected to execute all live in
# build/verification/VERIFICATION_MODEL.json. Orchestration written twice is orchestration that can
# disagree with itself, and it did: a step once lost a line continuation and the required RabbitMQ job
# could not run at all while every token a rule looked for was still present.
#
# Every retained capability that can run on the build machine runs here. What needs a real cloud
# resource is named in the model as an open proof and has no job at all: a selectable target without
# an executing job ends green on an inventory print, which is false green.
#
# Linux only. REQ-CLEAN-002 makes the required profile Linux, and nothing in this product is built or
# supported for Windows.
name: Required CI

# No path filter. A path allowlist on the trigger removes every required job at once, and for every
# change outside the list. A required profile runs on every push and pull request.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to the commit each tag pointed at, with the tag beside it so a reader can see
# which release was chosen. A tag is a moving reference: whoever can move it can change what runs in
# this repository. The runner image is named rather than left to ubuntu-latest, which moves to the next
# LTS whenever GitHub decides.

env:
  # Exactly what global.json releases. A floating '10.0.x' can resolve to an SDK the
  # repository has not approved, and global.json would then fail the build after the fact.
  DOTNET_VERSION: '10.0.302'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  legacy-tooling:
    name: "Required: Legacy Test Tooling"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Temporary takeover runners remain executable until the behavior cohort they protect has an
      # accepted native replacement. They are not extended with new test architecture.
      - name: Verification model
        run: python3 tools/ci/verification/model.py
      - name: CI tool self-tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Identity tool self-tests
        run: python3 -m unittest discover -s tools/identity -p 'test_*.py'
  build:
    name: "Required: Build"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ViciOne.ServiceBus.slnx --locked-mode
      - name: Build
        run: dotnet build ViciOne.ServiceBus.slnx -c Release --no-restore
      - name: Restore the engineering solution
        run: dotnet restore ViciOne.ServiceBus.Engineering.slnx --locked-mode
      - name: Build the engineering solution
        run: dotnet build ViciOne.ServiceBus.Engineering.slnx -c Release --no-restore
  core-unit:
    name: "Required: Core/Unit"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-core-unit
          path: |
            artifacts/verification
            artifacts/run-output
  benchmarks:
    name: "Required: Engineering"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection engineering
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-benchmarks
          path: |
            artifacts/verification
            artifacts/run-output
  rabbitmq:
    name: "Required: RabbitMQ"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection rabbitmq
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-rabbitmq
          path: |
            artifacts/verification
            artifacts/run-output
  activemq:
    name: "Required: ActiveMQ"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection activemq
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-activemq
          path: |
            artifacts/verification
            artifacts/run-output
  sql-transport:
    name: "Required: SQL Transport"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection sql-transport
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-sql-transport
          path: |
            artifacts/verification
            artifacts/run-output
  entity-framework:
    name: "Required: EntityFrameworkCore"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify
        run: python3 tools/ci/verify.py --selection entity-framework
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-entity-framework
          path: |
            artifacts/verification
            artifacts/run-output
  pack:
    name: "Required: Pack"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pack runs only after every required gate is green. It builds verifiable run artifacts and
    # publishes nothing: no nuget.org push, no registry, no external side effect of any kind.
    needs:
      - legacy-tooling
      - build
      - core-unit
      - activemq
      - sql-transport
      - benchmarks
      - rabbitmq
      - entity-framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # This job starts from a clean checkout, so the chain is closed inside it: an explicit locked
      # restore, then a build, then a pack that restores nothing again. An implicit restore inside
      # pack would resolve the graph unbound, which is the one thing the lock files exist to prevent.
      - name: Restore
        run: dotnet restore ViciOne.ServiceBus.slnx --locked-mode
      - name: Build
        run: dotnet build ViciOne.ServiceBus.slnx -c Release --no-restore
      # The output directory is emptied first, so "a package is there" means this run produced it.
      # Without that the hash step below is satisfied by whatever an earlier run left behind, which is
      # exactly what a local run showed when pack itself had failed.
      - name: Pack
        run: |
          rm -rf artifacts/packages
          dotnet pack ViciOne.ServiceBus.slnx -c Release --no-build --no-restore -o artifacts/packages
      - name: Hash packages
        run: |
          set -euo pipefail
          test -n "$(ls -A artifacts/packages)" || { echo "pack produced no package"; exit 1; }
          sha256sum artifacts/packages/*.nupkg | tee artifacts/packages/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-packages
          path: artifacts/packages
          if-no-files-found: error
