# ViciOne modification: WP-F2-SERVICEBUS-CI-BASELINE-03, 2026-08-08.
#
# Scheduled entry point for the extended profile.
#
# This file previously defined its own broker services and referenced the images
# vicione-servicebus/rabbitmq:latest and vicione-servicebus/activemq:latest, which do not exist:
# a global identity rename had rewritten two external Docker Hub names. Both references are gone.
#
# It now calls extended-transports.yml instead of restating its jobs. There is exactly one
# definition of the extended profile; this file only adds a schedule to it. Nothing here is part of
# the required profile, and nothing here publishes to a registry.
name: Nightly Extended Transports

on:
  schedule:
    # Nightly, well outside working hours in CET.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activemq:
    name: "Nightly: ActiveMQ"
    uses: ./.github/workflows/extended-transports.yml
    with:
      target: activemq
