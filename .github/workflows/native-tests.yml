# One repository workflow and one test verdict: xUnit 4 discovers and asserts, while Microsoft
# Testing Platform v2 owns execution and process exit. Python is used only for provider lifecycle
# orchestration and non-test engineering gates.
name: Native Build and Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: "Required: Product and Engineering Build"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore product graph in locked mode
        run: dotnet restore ViciOne.ServiceBus.slnx --locked-mode
      - name: Build product graph in Release
        run: dotnet build ViciOne.ServiceBus.slnx -c Release --no-restore
      - name: Run the minimal suite composition
        run: >-
          dotnet run
          --project samples/SuiteComposition/ViciOne.ServiceBus.Samples.SuiteComposition.csproj
          -c Release --no-build --no-restore
      - name: Restore complete engineering graph in locked mode
        run: dotnet restore ViciOne.ServiceBus.Engineering.slnx --locked-mode
      - name: Build complete engineering graph in Release
        run: dotnet build ViciOne.ServiceBus.Engineering.slnx -c Release --no-restore

  unit-architecture:
    name: "Required: Native Unit/Architecture"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependency graph
        run: dotnet restore ViciOne.ServiceBus.Tests.Unit.slnx --locked-mode
      - name: Build release test binaries
        run: dotnet build ViciOne.ServiceBus.Tests.Unit.slnx -c Release --no-restore
      - name: Run the complete profile without filters
        run: dotnet test --solution ViciOne.ServiceBus.Tests.Unit.slnx -c Release --no-build --no-restore --results-directory artifacts/test-results/unit --minimum-expected-tests 4900 --max-parallel-test-modules 1

  local-integration:
    name: "Required: Native Local Integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VICIONE_TESTS__Profile: LocalIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependency graph
        run: dotnet restore ViciOne.ServiceBus.Tests.LocalIntegration.slnx --locked-mode
      - name: Build release test binaries
        run: dotnet build ViciOne.ServiceBus.Tests.LocalIntegration.slnx -c Release --no-restore
      - name: Run the complete profile against pinned local providers
        run: >-
          python3 tools/ci/run_broker_category.py
          --broker postgres
          --broker azurite
          --broker localstack
          --broker activemq
          --broker artemis
          --broker eventhubs
          --allow-broker-outage activemq
          --command --
          dotnet test --solution ViciOne.ServiceBus.Tests.LocalIntegration.slnx
          -c Release --no-build --no-restore
          --results-directory artifacts/test-results/local-integration
          --minimum-expected-tests 332
          --max-parallel-test-modules 1

  sqlserver-local-integration:
    name: "Required: Native SQL Server Local Integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VICIONE_TESTS__Profile: LocalIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependency graph
        run: dotnet restore ViciOne.ServiceBus.Tests.SqlServerLocalIntegration.slnx --locked-mode
      - name: Build release test binaries
        run: dotnet build ViciOne.ServiceBus.Tests.SqlServerLocalIntegration.slnx -c Release --no-restore
      - name: Run the complete profile against the pinned local provider
        run: >-
          python3 tools/ci/run_broker_category.py
          --broker mssql
          --command --
          dotnet test --solution ViciOne.ServiceBus.Tests.SqlServerLocalIntegration.slnx
          -c Release --no-build --no-restore
          --results-directory artifacts/test-results/sqlserver-local-integration
          --minimum-expected-tests 68
          --max-parallel-test-modules 1

  azure-servicebus-local-integration:
    name: "Required: Native Azure Service Bus Local Integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VICIONE_TESTS__Profile: LocalIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependency graph
        run: dotnet restore ViciOne.ServiceBus.Tests.AzureServiceBusLocalIntegration.slnx --locked-mode
      - name: Build release test binaries
        run: dotnet build ViciOne.ServiceBus.Tests.AzureServiceBusLocalIntegration.slnx -c Release --no-restore
      - name: Run the complete profile against the pinned local provider
        run: >-
          python3 tools/ci/run_broker_category.py
          --broker servicebus
          --command --
          dotnet test --solution ViciOne.ServiceBus.Tests.AzureServiceBusLocalIntegration.slnx
          -c Release --no-build --no-restore
          --results-directory artifacts/test-results/azure-servicebus-local-integration
          --minimum-expected-tests 25
          --max-parallel-test-modules 1

  rabbitmq-local-integration:
    name: "Required: Native RabbitMQ Local Integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VICIONE_TESTS__Profile: LocalIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore locked dependency graph
        run: dotnet restore ViciOne.ServiceBus.Tests.RabbitMqLocalIntegration.slnx --locked-mode
      - name: Build release test binaries
        run: dotnet build ViciOne.ServiceBus.Tests.RabbitMqLocalIntegration.slnx -c Release --no-restore
      - name: Run the complete profile against the pinned local provider
        run: >-
          python3 tools/ci/run_broker_category.py
          --broker rabbitmq
          --command --
          dotnet test --solution ViciOne.ServiceBus.Tests.RabbitMqLocalIntegration.slnx
          -c Release --no-build --no-restore
          --results-directory artifacts/test-results/rabbitmq-local-integration
          --minimum-expected-tests 28
          --max-parallel-test-modules 1

  package-and-policy:
    name: "Required: Package, Security and Licence"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs:
      - build
      - unit-architecture
      - local-integration
      - sqlserver-local-integration
      - azure-servicebus-local-integration
      - rabbitmq-local-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore product graph in locked mode
        run: dotnet restore ViciOne.ServiceBus.slnx --locked-mode
      - name: Build product graph in Release
        run: dotnet build ViciOne.ServiceBus.slnx -c Release --no-restore
      - name: Pack without another restore or build
        run: dotnet pack ViciOne.ServiceBus.slnx -c Release --no-build --no-restore -o artifacts/packages
      - name: Restore the complete package-gate source graph
        run: dotnet restore ViciOne.ServiceBus.Engineering.slnx --locked-mode
      - name: Verify package-only developer journeys and testing harnesses
        run: tools/ci/verify_developer_journeys.sh
      - name: Bind package bytes
        run: sha256sum artifacts/packages/*.nupkg > artifacts/packages/SHA256SUMS
      - name: Inventory vulnerable dependency paths
        run: python3 tools/ci/vulnerability_inventory.py --solution ViciOne.ServiceBus.slnx --out artifacts/policy/VULNERABILITY_INVENTORY.json
      - name: Generate current repository change overview
        run: python3 license/repository_diff.py > artifacts/policy/REPOSITORY_DIFF.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-native-package-and-policy
          path: |
            artifacts/packages
            artifacts/policy
          if-no-files-found: error
