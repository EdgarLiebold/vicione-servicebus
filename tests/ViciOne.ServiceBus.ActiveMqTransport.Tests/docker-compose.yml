# ViciOne modification: WP-F2-SERVICEBUS-CI-BASELINE-03, 2026-08-08.
#
# This file used to reference vicione-servicebus/activemq:latest, an image that does not exist.
# It now extends the single pinned fixture definition instead of restating it.
#
#   source ../../build/test-infrastructure/new-run-credentials.sh
#   docker compose up -d --wait
services:
  activemq:
    extends:
      file: ../../build/test-infrastructure/compose.yaml
      service: activemq

  # Artemis is a separate broker, not part of the ViciOne fixture. It is defined once in the pinned
  # compose file and only referenced here, so this project cannot drift into a second definition.
  artemis:
    extends:
      file: ../../build/test-infrastructure/compose.yaml
      service: artemis
