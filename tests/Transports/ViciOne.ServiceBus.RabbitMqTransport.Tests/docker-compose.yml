#
# This file used to reference vicione-servicebus/rabbitmq:latest, an image that does not exist.
# It now extends the single pinned fixture definition instead of restating it, so a local run and
# a CI run start byte-identical containers.
#
#   source ../../build/test-infrastructure/new-run-credentials.sh
#   docker compose up -d --wait
services:
  rabbit:
    extends:
      file: ../../build/test-infrastructure/compose.yaml
      service: rabbitmq
