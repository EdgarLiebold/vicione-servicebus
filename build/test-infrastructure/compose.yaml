#
# One fixture definition for both worlds. A local developer and GitHub Actions start the very
# same services from the very same pinned build contexts; nothing is published to a registry.
#
# Host ports are ephemeral: "127.0.0.1::5672" lets Docker assign a free loopback port per run and
# publish it atomically. A fixed port collides with anything already listening on the developer
# machine, and probing for a free port first would only trade the collision for a binding race.
# The canonical runner asks Docker afterwards which ports were actually bound.
#
# Do not start these by hand; tools/ci/run_broker_category.py is the single entry point for local
# runs and for CI alike:
#
#   python3 tools/ci/run_broker_category.py --broker rabbitmq --category rabbitmq --project <csproj>
#
# Credentials are never stored here. new-run-credentials.sh generates a fresh account per run
# and exports the variables consumed below; an unset variable fails the run instead of silently
# falling back to a well known account.
#
# Every published port binds to 127.0.0.1 explicitly. A bare "5672:5672" listens on every host
# interface depending on the Docker host configuration, which publishes a test broker far wider
# than a local or CI fixture ever needs. Container-to-container traffic inside the compose network
# is unaffected by this and keeps working.

services:
  rabbitmq:
    build:
      context: ./rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${VICIONE_SERVICEBUS_RMQ_USER:?run credentials are missing, source new-run-credentials.sh}
      RABBITMQ_DEFAULT_PASS: ${VICIONE_SERVICEBUS_RMQ_PASS:?run credentials are missing, source new-run-credentials.sh}
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::15672"
    healthcheck:
      # Readiness must cover the management API as well: the test set up creates the 'test'
      # virtual host over HTTP, so a broker that answers AMQP but not HTTP is not ready.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # Artemis is a second, separate broker. The required ActiveMQ LocalIntegration provider variants
  # use this pinned, run-scoped fixture instead of a fixed port or shared credentials. It therefore
  # obeys the same isolation, readiness and teardown rules as every other required fixture.
  artemis:
    image: quay.io/artemiscloud/activemq-artemis-broker@sha256:f22d0bf16d7dbb7b928a048f27e4e4f537ac9af00a5fd31cf4b73a889cc0bd2a
    environment:
      AMQ_USER: ${VICIONE_SERVICEBUS_ARTEMIS_USER:?run credentials are missing, source new-run-credentials.sh}
      AMQ_PASSWORD: ${VICIONE_SERVICEBUS_ARTEMIS_PASS:?run credentials are missing, source new-run-credentials.sh}
      # Artemis' create-time disk autotuning can derive an invalid negative page-sync timeout on
      # throttled Docker Desktop storage. A fixed NIO journal profile makes fixture startup
      # reproducible while retaining real persistent broker semantics.
      # Jolokia remains authenticated and loopback-only at the host boundary. Relax only its
      # browser-origin allowlist so the run-scoped test client can use the management API.
      AMQ_EXTRA_ARGS: --no-autotune --nio --relax-jolokia
    ports:
      - "127.0.0.1::61616"
      - "127.0.0.1::8161"
    healthcheck:
      # The acceptor binds to the container address, not to loopback, so the check has to dial the
      # container's own name. A check against localhost never connects and would never turn healthy.
      test: ["CMD-SHELL", "/opt/amq/bin/artemis check node --url tcp://$$HOSTNAME:61616 --user \"$$AMQ_USER\" --password \"$$AMQ_PASSWORD\""]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 15s

  # The Entity Framework specs need a real SQL Server and a real PostgreSQL. The imported baseline ran
  # them on ubuntu with service containers; the connection provider is called LocalDb but its first two
  # candidates are a Linux SQL Server. Both are pinned here so the required category has a fixture at all.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    # amd64 only, and stated rather than discovered: on an arm64 developer machine this runs under
    # emulation, which is why the SQL Server proof belongs to the x64 runner and PostgreSQL is the fast
    # local dialect check.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${VICIONE_SERVICEBUS_MSSQL_PASS:?run credentials are missing, source new-run-credentials.sh}
    ports:
      - "127.0.0.1::1433"
    healthcheck:
      # A started process is not a usable server: readiness means the engine answers a query.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    # Npgsql promotes an ambient transaction that also contains a volatile ServiceBus enlistment to
    # PostgreSQL's prepared-transaction protocol. The default image disables that protocol, which
    # would test a deliberately incomplete server instead of the supported System.Transactions path.
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    environment:
      POSTGRES_USER: ${VICIONE_SERVICEBUS_PG_USER:?run credentials are missing, source new-run-credentials.sh}
      POSTGRES_PASSWORD: ${VICIONE_SERVICEBUS_PG_PASS:?run credentials are missing, source new-run-credentials.sh}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    # The data directory lives in memory. A test fixture keeps nothing between runs, and this removes the
    # one way a stale volume could survive with the credentials of an earlier run.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0@sha256:37493d0f2e764467421ffe16eb3caa39277e5fa7f6adea18eb5bbfb3c5247f98
    environment:
      AZURITE_ACCOUNTS: ${VICIONE_SERVICEBUS_AZURITE_ACCOUNT:?run credentials are missing}:${VICIONE_SERVICEBUS_AZURITE_KEY:?run credentials are missing}
    command: azurite --silent --location /data --tableHost 0.0.0.0 --tablePort 10002
    ports:
      - "127.0.0.1::10002"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const socket=require('net').connect(10002,'127.0.0.1'); socket.on('connect',()=>{socket.end();process.exit(0)}); socket.on('error',()=>process.exit(1))\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sqs,sns,dynamodb,s3
      GATEWAY_LISTEN: 0.0.0.0:4566
      PERSISTENCE: "0"
    ports:
      - "127.0.0.1::4566"
    tmpfs:
      - /var/lib/localstack
    healthcheck:
      # Readiness crosses every AWS protocol this fixture owns. A gateway TCP listener alone says
      # nothing about whether SQS, SNS, DynamoDB and S3 can parse and answer signed SDK requests.
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null && awslocal sns list-topics >/dev/null && awslocal dynamodb list-tables >/dev/null && awslocal s3api list-buckets >/dev/null"]
      interval: 2s
      timeout: 10s
      retries: 45
      start_period: 5s

  # A plain TCP relay in front of ActiveMQ, started only by a run that needs to take the broker away
  # and bring it back. The proxy is never restarted, so the three addresses handed to the test process
  # survive a broker restart that would otherwise rebind every ephemeral port.
  activemq-proxy:
    image: haproxy:3.4.3-alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1::61616"
      - "127.0.0.1::5672"
      - "127.0.0.1::8161"
    healthcheck:
      # The proxy is ready when it is listening. Whether anything is behind it is exactly what the
      # outage changes, so it must not be part of the proxy's own health.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 61616 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  activemq:
    build:
      context: ./activemq
    environment:
      ACTIVEMQ_CONNECTION_USER: ${VICIONE_SERVICEBUS_AMQ_USER:?run credentials are missing, source new-run-credentials.sh}
      ACTIVEMQ_CONNECTION_PASSWORD: ${VICIONE_SERVICEBUS_AMQ_PASS:?run credentials are missing, source new-run-credentials.sh}
      ACTIVEMQ_WEB_USER: ${VICIONE_SERVICEBUS_AMQ_USER:?run credentials are missing, source new-run-credentials.sh}
      ACTIVEMQ_WEB_PASSWORD: ${VICIONE_SERVICEBUS_AMQ_PASS:?run credentials are missing, source new-run-credentials.sh}
    ports:
      - "127.0.0.1::61616"
      - "127.0.0.1::5672"
      - "127.0.0.1::8161"
    healthcheck:
      # Readiness means the Jolokia endpoint answers, because that is what the harness uses to
      # inspect and clean the broker. A running process that does not serve Jolokia is not ready.
      test: ["CMD-SHELL", "curl -sf -u \"$$ACTIVEMQ_WEB_USER:$$ACTIVEMQ_WEB_PASSWORD\" -H 'Origin: http://localhost' http://localhost:8161/api/jolokia/read/org.apache.activemq:type=Broker,brokerName=localhost | grep -q '\"status\":200'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
