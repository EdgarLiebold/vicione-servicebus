# A plain TCP relay in front of the ActiveMQ broker, and nothing else.
#
# It exists so that a test can hold one address across a broker restart. Compose publishes an
# ephemeral loopback port per container start, so a restarted broker comes back on a different port
# every time - measured twice, 32955 to 32958 and 33002 to 33005. The proxy is never restarted, so the
# addresses handed to the test process stay valid while the broker behind them really goes away and
# really comes back.
#
# It deliberately does nothing else: no load balancing, no retries, no health-based failover. A retry
# would hide the outage this fixture exists to produce.

global
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    # The broker is either there or it is not. Waiting longer would only delay the answer a test is
    # waiting for, and connecting through to a broker that is down has to fail rather than queue.
    timeout connect 2s
    timeout client  1h
    timeout server  1h
    # No reconnect attempts of our own: what the client sees has to be what the broker did.
    retries 0

# init-addr none lets the proxy start before the broker resolves, which is the normal state while the
# fixture is coming up and the state it returns to during an interrupt.
frontend openwire
    bind :61616
    default_backend openwire_broker

backend openwire_broker
    server broker activemq:61616 init-addr none resolvers docker

frontend amqp
    bind :5672
    default_backend amqp_broker

backend amqp_broker
    server broker activemq:5672 init-addr none resolvers docker

frontend jolokia
    bind :8161
    default_backend jolokia_broker

backend jolokia_broker
    server broker activemq:8161 init-addr none resolvers docker

# Docker's embedded DNS. Resolving on every connection is what lets a restarted container, which may
# have a new internal address, be reached again without restarting the proxy.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 1s
    hold other 1s
    hold refused 1s
    hold nx 1s
    hold timeout 1s
